name: build-and-test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  LucideUsePrebuiltNativeTools: 'true'

jobs:
  native-tools:
    uses: ./.github/workflows/native-aot.yml

  build-and-test:
    needs: native-tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true

      - name: Restore build tasks
        run: dotnet restore src/Soenneker.Quark.Gen.Lucide.BuildTasks/Soenneker.Quark.Gen.Lucide.BuildTasks.csproj --verbosity minimal

      - name: Build build tasks
        run: dotnet build src/Soenneker.Quark.Gen.Lucide.BuildTasks/Soenneker.Quark.Gen.Lucide.BuildTasks.csproj --configuration Release --no-restore --verbosity minimal

      - name: Restore tests
        run: dotnet restore test/Soenneker.Quark.Gen.Lucide.Tests/Soenneker.Quark.Gen.Lucide.Tests.csproj --verbosity minimal

      - name: Build tests
        run: dotnet build test/Soenneker.Quark.Gen.Lucide.Tests/Soenneker.Quark.Gen.Lucide.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Quark.Gen.Lucide.Tests/Soenneker.Quark.Gen.Lucide.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal

      - name: Restore library
        run: dotnet restore src/Soenneker.Quark.Gen.Lucide/Soenneker.Quark.Gen.Lucide.csproj --verbosity minimal

      - name: Build library
        run: dotnet build src/Soenneker.Quark.Gen.Lucide/Soenneker.Quark.Gen.Lucide.csproj --configuration Release --no-restore --verbosity minimal

      - name: Pack
        run: dotnet pack src/Soenneker.Quark.Gen.Lucide/Soenneker.Quark.Gen.Lucide.csproj --configuration Release --no-build --no-restore --output . --verbosity minimal
