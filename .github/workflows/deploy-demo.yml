name: deploy-demo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  LucideUsePrebuiltNativeTools: 'true'

jobs:
  native-tools:
    uses: ./.github/workflows/native-aot.yml

  build-demo:
    needs: native-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
          workloads: wasm-tools

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true

      - name: Restore build tasks
        run: dotnet restore src/Soenneker.Quark.Gen.Lucide.BuildTasks/Soenneker.Quark.Gen.Lucide.BuildTasks.csproj --verbosity minimal

      - name: Build build tasks
        run: dotnet build src/Soenneker.Quark.Gen.Lucide.BuildTasks/Soenneker.Quark.Gen.Lucide.BuildTasks.csproj --configuration Release --no-restore --verbosity minimal

      - name: Restore demo
        run: dotnet restore test/Soenneker.Quark.Gen.Lucide.Demo/Soenneker.Quark.Gen.Lucide.Demo.csproj --verbosity minimal

      - name: Publish Blazor WebAssembly Demo
        run: dotnet publish test/Soenneker.Quark.Gen.Lucide.Demo/Soenneker.Quark.Gen.Lucide.Demo.csproj -c Release

      - name: Set Base Href for GitHub Pages
        run: |
          cd test/Soenneker.Quark.Gen.Lucide.Demo/bin/Release/net11.0/publish/wwwroot
          sed -i 's|<base href="/"|<base href="/${{ github.event.repository.name }}/"|' index.html
          grep -Fq '<base href="/${{ github.event.repository.name }}/"' index.html

      - name: Add .nojekyll
        run: touch test/Soenneker.Quark.Gen.Lucide.Demo/bin/Release/net11.0/publish/wwwroot/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: test/Soenneker.Quark.Gen.Lucide.Demo/bin/Release/net11.0/publish/wwwroot

  deploy-demo:
    needs: build-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
