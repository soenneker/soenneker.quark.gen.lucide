name: native-aot

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Publish Native AOT executable
        run: dotnet publish src/Soenneker.Quark.Gen.Lucide.BuildTasks -c Release -r ${{ matrix.rid }} -o artifacts/native/${{ matrix.rid }}
      - name: Verify native generator output
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { ".exe" } else { "" }
          $env:QUARK_NATIVE_TOOL = Join-Path $PWD "artifacts/native/${{ matrix.rid }}/Soenneker.Quark.Gen.Lucide.BuildTasks$extension"
          dotnet test --project test/Soenneker.Quark.Gen.Lucide.Tests -c Release -p:LucideUsePrebuiltNativeTools=true -- --treenode-filter "/*/*/NativeExecutableTests/*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/
            !artifacts/native/**/*.pdb
            !artifacts/native/**/*.dbg
            !artifacts/native/**/*.dSYM/**
          if-no-files-found: error
